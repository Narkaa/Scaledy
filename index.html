<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English ↔ Mongolian Translator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="light">
    <h1>English ↔ Mongolian Translator</h1>
    <textarea id="inputText" placeholder="Enter text" rows="4" cols="50"></textarea>
    <div class="buttons">
        <button id="translateBtn">Translate</button>
        <button id="toggleBtn">Switch to Mongolian → English</button>
    </div>
    <p id="outputText"></p>
    <script src="script.js"></script>
</body>
</html>
